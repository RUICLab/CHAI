[pytest]
# Confine collection to tests/. Benchmark directories under eval-apps/ contain
# ad-hoc scripts named test_*.py (for example
# eval-apps/accept-activityrec/test_fixed.py) that read main.c at import time
# and are not pytest tests; collecting them fails the whole run.
testpaths = tests
norecursedirs =
    eval-apps
    benchmark_applications
    experiment_results
    results_archive
    llm-prerun
    fused-checkmate
    fusedBin
    outputs
    logs
    target
    compilation_testing
    knob_tuning
addopts = -q
